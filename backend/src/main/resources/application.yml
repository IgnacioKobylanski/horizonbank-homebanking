spring:
  application:
    name: homebanking
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:homebanking}
    username: ${POSTGRES_USER:homebanking}
    password: ${POSTGRES_PASSWORD:homebanking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
      refresh-token-ttl: 7d